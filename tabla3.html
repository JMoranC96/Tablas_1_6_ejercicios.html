<!DOCTYPE html>
<html>
<head>
   <title>Tabla con alineaciones</title>
   <meta charset="UTF-8">
</head>
<body>
<!-- tabla -->
<table width="600" border="2" cellspacing="1" align="center">

<!-- Fila 1 -->
<tr>
   <th>Cabecera de Titulo 1</th>
   <th>Cabecera de Titulo 2</th>
   <th>Cabecera de Titulo 3</th>
   <th>Cabecera de Titulo 4</th>
</tr>

<!-- Fila 2 -->
<tr>
   <td align="left">Celda 1</td>
   <td align="center">Celda 2</td>
   <td align="right">Celda 3</td>
   <td align="center">Celda 4</td>
</tr>

<!-- Fila 3 -->
<tr height="100">
   <td align="left" valign="top">Celda 5</td>
   <td align="center" valign="top"><img src="libropix.png" alt="libro" width="80" height="80"></td>
   <td align="right" valign="bottom">Celda 7</td>
   <td align="center" valign="middle">Celda 8</td>
</tr>

<!-- Fila 4 -->
<tr height="100">
   <td align="left" valign="bottom">Celda 9</td>
   <td align="left" valign="middle">Celda 10</td>
   <td align="left" valign="middle"><img src="mundopix.png" alt="mundo" width="80" height="80"></td>
   <td align="left" valign="top">Celda 12</td>
</tr>


</table>
</body>
</html>
